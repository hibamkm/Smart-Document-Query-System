{% extends 'auth_base.html' %}
{% block title %}Create account · Smart Doc Query{% endblock %}
{% block auth_content %}
<h2>Create your account</h2>
<p class="auth-lead">Each account gets its own private library and history.</p>

<form method="POST" class="form" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">
        <span>Username</span>
        <input type="text" name="username" value="{{ form.get('username', '') }}" placeholder="3-30 letters, numbers, . - _" required autofocus autocomplete="username" pattern="[A-Za-z0-9_.\-]{3,30}">
    </label>
    <label class="field">
        <span>Email</span>
        <input type="email" name="email" value="{{ form.get('email', '') }}" placeholder="you@example.com" required autocomplete="email">
    </label>
    <label class="field">
        <span>Password</span>
        <div class="pw">
            <input type="password" name="password" id="pw1" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
            <button type="button" class="link-btn" data-toggle-pw>Show</button>
        </div>
        <div class="strength" id="strength" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </label>
    <label class="field">
        <span>Confirm password</span>
        <input type="password" name="confirm_password" id="pw2" placeholder="Repeat password" required autocomplete="new-password">
    </label>
    <button type="submit" class="btn btn-primary btn-block btn-lg">Create account</button>
</form>

<p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
{% endblock %}
