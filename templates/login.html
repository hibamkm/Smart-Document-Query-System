{% extends 'auth_base.html' %}
{% block title %}Sign in · Smart Doc Query{% endblock %}
{% block auth_content %}
<h2>Welcome back</h2>
<p class="auth-lead">Sign in to continue to your documents.</p>

<form method="POST" class="form" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">
        <span>Username</span>
        <input type="text" name="username" placeholder="your username" required autofocus autocomplete="username">
    </label>
    <label class="field">
        <span>Password</span>
        <div class="pw">
            <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="link-btn" data-toggle-pw>Show</button>
        </div>
    </label>
    <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
</form>

<p class="auth-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
